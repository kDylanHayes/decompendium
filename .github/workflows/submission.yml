name: submission

# Checks a submitted project: posts or updates one bot comment and sets the
# ready-for-review / needs-info labels. Only the issue number reaches the
# script; it reads the issue text through the API, never through the shell.
on:
  issues:
    types: [opened, edited, reopened]
  # Issues opened by the onboard workflow don't trigger the event above (Actions-token
  # events never start workflows), so it dispatches the check instead.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to check
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: submission-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # The game index is derived from libretro-database (CC BY-SA); it is cached, never committed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/game-index.json
          key: game-index-${{ steps.week.outputs.week }}
      - name: Build the game index if needed
        run: test -f .cache/game-index.json || pnpm identify --build
      - name: Check the submission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          # Optional: confirms games the release catalogues don't cover (PC, Switch, ...).
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: pnpm submission check --issue "$ISSUE"
