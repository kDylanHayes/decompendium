name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets the approve workflow run checks on the branches it opens PRs from.
  workflow_dispatch:

# Runs PR code, so it gets no secrets and read-only access.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - name: Build the site (catalog only, no progress data)
        env:
          DATA_DIR: ${{ runner.temp }}/no-data
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm build

  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Classify changes for review
        # PR fields are passed through the environment, never interpolated into the script.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: pnpm classify-pr "origin/$BASE_REF" --out "$RUNNER_TEMP/classification.json"
      # The pr-labels workflow reads this to set the owner-change label; PR code never gets write access.
      - name: Save the classification
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -f "$RUNNER_TEMP/classification.json" || echo '{"verdict":"needs-review"}' > "$RUNNER_TEMP/classification.json"
          node -e '
            const fs = require("fs"), f = process.env.RUNNER_TEMP + "/classification.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            fs.writeFileSync(f, JSON.stringify({ pr: Number(process.env.PR_NUMBER), head_sha: process.env.HEAD_SHA, verdict: c.verdict }));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: classification
          path: ${{ runner.temp }}/classification.json
          retention-days: 3
